# Bundled offline rule pack for appsec-mcp. Rule ids use dashes only (no dots).
# metadata.appsec_fix names the fixer that can patch the finding, when one exists.
rules:
  - id: js-sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL query built from request data. Use a parameterised query.
    metadata: {cwe: "CWE-89: SQL Injection", severity: CRITICAL}
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $X + ..., ...)
          - pattern: $DB.query("..." + $X, ...)
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: $DB.execute("..." + $X + ..., ...)
  - id: js-xss-response
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data is written into the HTML response without escaping.
    metadata: {cwe: "CWE-79: Cross-site Scripting"}
    pattern-either:
      - pattern: $RES.send(<... $REQ.query ...>)
      - pattern: $RES.send(<... $REQ.params ...>)
      - pattern: $RES.send(<... $REQ.body ...>)
  - id: js-dom-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: HTML is assigned to innerHTML without escaping.
    metadata: {cwe: "CWE-79: Cross-site Scripting"}
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: document.write($X)
  - id: js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() runs code built from a string.
    metadata: {cwe: "CWE-95: Eval Injection"}
    pattern: eval($X)
  - id: js-cors-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS is open to every origin.
    metadata: {cwe: "CWE-942: Permissive CORS", appsec_fix: cors_allowlist}
    pattern-either:
      - pattern: cors()
      - pattern: 'cors({..., origin: "*", ...})'
  - id: py-eval
    languages: [python]
    severity: ERROR
    message: eval()/exec() runs code built from a string.
    metadata: {cwe: "CWE-95: Eval Injection"}
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: py-sql-injection
    languages: [python]
    severity: ERROR
    message: SQL query built with string formatting. Use a parameterised query.
    metadata: {cwe: "CWE-89: SQL Injection", severity: CRITICAL, appsec_fix: sql_param}
    pattern-either:
      - pattern: $CUR.execute(f"...")
      - pattern: $CUR.execute("..." + $X)
      - pattern: $CUR.execute("..." % $X)
      - pattern: $CUR.execute("...".format(...))
  - id: py-flask-debug
    languages: [python]
    severity: ERROR
    message: Flask debug mode is on, which exposes an interactive debugger.
    metadata: {cwe: "CWE-489: Active Debug Code", appsec_fix: flask_debug}
    pattern: $APP.run(..., debug=True, ...)
  - id: py-pickle
    languages: [python]
    severity: ERROR
    message: pickle can run code while loading untrusted data.
    metadata: {cwe: "CWE-502: Deserialization of Untrusted Data"}
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
  - id: py-shell-true
    languages: [python]
    severity: ERROR
    message: A command runs through the shell.
    metadata: {cwe: "CWE-78: OS Command Injection"}
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
  - id: java-sql-injection
    languages: [java]
    severity: ERROR
    message: SQL query built by string concatenation. Use PreparedStatement with ? parameters.
    metadata: {cwe: "CWE-89: SQL Injection", severity: CRITICAL}
    pattern-either:
      - pattern: $S.executeQuery("..." + $X + ...)
      - pattern: $S.executeQuery("..." + $X)
      - pattern: $S.executeUpdate("..." + $X + ...)
      - pattern: $S.execute("..." + $X + ...)
  - id: java-deserialization
    languages: [java]
    severity: ERROR
    message: ObjectInputStream deserialises untrusted bytes.
    metadata: {cwe: "CWE-502: Deserialization of Untrusted Data"}
    pattern: new ObjectInputStream(...)
  - id: c-strcpy
    languages: [c, cpp]
    severity: ERROR
    message: strcpy() does not check the destination size.
    metadata: {cwe: "CWE-120: Buffer Copy without Checking Size", appsec_fix: strcpy}
    pattern: strcpy(...)
  - id: c-gets
    languages: [c, cpp]
    severity: ERROR
    message: gets() cannot be used safely.
    metadata: {cwe: "CWE-242: Use of Inherently Dangerous Function", severity: CRITICAL, appsec_fix: gets}
    pattern: gets(...)
  - id: c-format-string
    languages: [c, cpp]
    severity: ERROR
    message: A variable is used as the format string.
    metadata: {cwe: "CWE-134: Uncontrolled Format String"}
    patterns:
      - pattern: printf($X)
      - pattern-not: printf("...")
