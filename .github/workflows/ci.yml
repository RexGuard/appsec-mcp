name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build and test the viewer
        working-directory: viewer
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q

      - name: Self-scan
        run: uv run appsec-mcp scan . --fail-on high
