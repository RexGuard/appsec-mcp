<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppSec Viewer</title>

    <main id="app" class="mx-auto max-w-7xl px-4 py-6"></main>
    <script type="module" src="/src/main.ts"></script>
