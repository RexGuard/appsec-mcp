[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "appsec-mcp"
version = "0.1.0"
description = "An MCP server that scans your app for security problems, maps what it read, and proposes safe fixes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Erick Sientaro" }]
keywords = ["mcp", "security", "sast", "appsec", "claude"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pathspec>=0.12",
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
appsec-mcp = "appsec_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appsec_mcp"]
artifacts = ["src/appsec_mcp/viewer_dist/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/vuln_apps", "viewer"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S311"]
# SQL f-strings only splice module constants; tests/storage/test_storage.py enforces this.
"src/appsec_mcp/storage/**" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["scanners: needs real Semgrep/gitleaks/OSV-Scanner binaries"]
